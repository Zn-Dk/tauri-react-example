name: build-android

# push 到 main 自动构建（CI）；也可在 Actions 页手动 Run（可选 debug/release/all）
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      mode:
        description: '构建模式'
        type: choice
        options: [all, debug, release]
        default: all

# 同一分支连续 push 时取消旧 run，只跑最新（防浪费，替代手动）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub 不允许 job 级 if 引用 matrix，故用前置 job 输出动态 matrix
  # push 触发时 inputs.mode 为空字符串 → 默认 all（debug+release 都构建）
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ] || [ "$MODE" = "all" ]; then
            echo 'matrix={"mode":["debug","release"]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"mode\":[\"$MODE\"]}" >> "$GITHUB_OUTPUT"
          fi

  build-android:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 安装 Rust 工具链（仅 arm64 目标）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # ubuntu-latest 预装 Android SDK（$ANDROID_HOME），补装 NDK
      - name: Install Android NDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "ndk;27.0.12077973" "cmake;3.22.1"
          echo "NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      # CI 内生成 gen/android（不提交仓库）
      - name: Init Android project
        run: pnpm tauri android init
      # 按 matrix.mode 构建 debug 或 release（仅 arm64）
      - name: Build Android APK (${{ matrix.mode }})
        run: |
          if [ "${{ matrix.mode }}" = "debug" ]; then
            pnpm tauri android build --apk --debug --target aarch64
          else
            pnpm tauri android build --apk --target aarch64
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-apk-${{ matrix.mode }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
